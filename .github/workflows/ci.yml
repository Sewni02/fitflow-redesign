name: CI

"on": [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and build backend (if it exists)
        run: |
          if [ -f backend/package.json ]; then
            cd backend && npm install && npm run build
          else
            echo "backend/package.json not found yet - skipping (backend code not added yet)"
          fi

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ai-service dependencies (if they exist)
        run: |
          if [ -f ai-service/requirements.txt ]; then
            cd ai-service && pip install -r requirements.txt
          else
            echo "ai-service/requirements.txt not found yet - skipping (AI service code not added yet)"
          fi